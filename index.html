  <meta name="description" content="국토안전관리원 국토안전기술연구원 정책연구실 주요 링크 모음" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── 색상 변수 ─────────────────────────────────────────── */
    /* CI 공식 색상: PANTONE 288 C(진남색) + PANTONE 301 C(파랑) */
    :root {
      --color-primary:   #003876; /* PANTONE 288 C — 기관 대표색 */
      --color-secondary: #0067B1; /* PANTONE 301 C — 보조색 */
      --color-bg:        #f4f6f9;
      --color-surface:   #ffffff;
      --color-text:      #1a1a2e;
      --color-text-sub:  #555577;
      --color-border:    #dde3ed;
      --color-shadow:    rgba(0, 56, 118, 0.10);
      --color-badge-bg:  #e8eef7;
      --color-badge-txt: #003876;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg:        #0d1117;
        --color-surface:   #161b22;
        --color-text:      #e6edf3;
        --color-text-sub:  #8b949e;
        --color-border:    #30363d;
        --color-shadow:    rgba(0, 0, 0, 0.40);
        --color-badge-bg:  #1c2a3a;
        --color-badge-txt: #79b8ff;
      }
    }

    /* ─── 리셋 & 기본 ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 17px; }
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 2rem;
    }

    /* ─── 헤더 ──────────────────────────────────────────────── */
    header {
      width: 100%;
      background: var(--color-primary);
      color: #fff;
      padding: 2rem 1.5rem 1.6rem;
      text-align: center;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }
    .logo-img {
      width: 84px;
      height: auto;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }
    header p.dept {
      margin-top: 0.35rem;
      font-size: 0.88rem;
      font-weight: 400;
      opacity: 0.85;
    }

    /* ─── 메인 컨테이너 ─────────────────────────────────────── */
    main {
      width: 100%;
      max-width: 520px;
      padding: 1.5rem 1rem 0;
      flex: 1;
    }
    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-text-sub);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      padding-left: 2px;
    }

    /* ─── 카드 버튼 ─────────────────────────────────────────── */
    .card-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .card {
      display: flex;
      align-items: center;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      padding: 1.1rem 0.9rem;
      text-decoration: none;
      color: var(--color-text);
      box-shadow: 0 2px 8px var(--color-shadow);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      min-height: 72px; /* 터치 영역 확보 */
      gap: 0.75rem;
      /* button처럼 사용할 경우를 위한 리셋 */
      font-family: inherit;
      font-size: inherit;
      text-align: left;
      width: 100%;
      background-color: var(--color-surface);
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--color-shadow);
      border-color: var(--color-secondary);
      outline: none;
    }
    .card:active { transform: translateY(0); }
    .card-icon {
      flex-shrink: 0;
      width: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
    }
    @media (prefers-color-scheme: dark) {
      .card-icon { color: #79b8ff; }
    }
    .card-body { flex: 1; }
    .card-title {
      display: block;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .card-desc {
      display: block;
      font-size: 0.8rem;
      color: var(--color-text-sub);
      margin-top: 0.25rem;
      line-height: 1.5;
    }
    .card-arrow {
      flex-shrink: 0;
      color: var(--color-secondary);
      opacity: 1;
      display: flex;
      align-items: center;
    }

    /* 구독 카드 전용 */
    .card.subscribe {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      border-color: #76BC21;
      border-width: 2px;
    }
    .card.subscribe .card-top {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }
    .card.subscribe .card-arrow { margin-left: auto; }
    .privacy-note {
      font-size: 0.72rem;
      color: var(--color-text-sub);
      line-height: 1.55;
      border-top: 1px solid var(--color-border);
      padding-top: 0.5rem;
      width: 100%;
    }
    .privacy-note strong { font-weight: 700; }

    /* ─── 푸터 ──────────────────────────────────────────────── */
    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--color-text-sub);
      line-height: 1.7;
    }
    footer a {
      color: var(--color-secondary);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
